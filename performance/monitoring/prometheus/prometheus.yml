global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: iter-perf-local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Windows 호스트에서 실행 중인 Spring Boot 관리 포트를 Docker 컨테이너가 수집합니다.
  - job_name: iter-spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:9091
        labels:
          application: iter

